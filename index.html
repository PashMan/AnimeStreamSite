    <!-- Global Shim & Error Shield for 3rd-party player tracking scripts (e.g. 200.js / M_ID) -->
    <script>
      (function() {
        try {
          if (!window.M_ID) {
            window.M_ID = {};
          }
        } catch (_) {}
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reasonStr = String(event.reason || '');
            var stackStr = String(event.reason && event.reason.stack ? event.reason.stack : '');
            if (reasonStr.includes('M_ID') || stackStr.includes('200.js') || reasonStr.includes('200.js')) {
              event.preventDefault();
            }
          } catch (_) {}
        });
        window.addEventListener('error', function(event) {
          try {
            var msg = String(event.message || '');
            var filename = String(event.filename || '');
            if (msg.includes('M_ID') || filename.includes('200.js')) {
              event.preventDefault();
              return true;
            }
          } catch (_) {}
        });
      })();
    </script>

    <!-- Early script load failure and stale chunk cache buster -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          try {
            var target = e.target;
            var src = target && (target.src || target.href || '');
            var isAppScript = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') && (
              src.indexOf('/assets/') !== -1 || src.indexOf('/index.') !== -1
            );
            var msg = String(e.message || '');
            var isModuleFail = msg.indexOf('Failed to load module script') !== -1 ||
                               msg.indexOf('Strict MIME type') !== -1 ||
                               msg.indexOf('dynamically imported module') !== -1 ||
                               msg.indexOf('error loading dynamically imported module') !== -1;
            
            // Only trigger if an actual application asset or module failed
            if (isAppScript || isModuleFail) {
              var reloadKey = 'kami_stale_bundle_reload_ts';
              var last = sessionStorage.getItem(reloadKey);
              var now = Date.now();
              if (!last || now - parseInt(last, 10) > 10000) {
                console.warn('[CacheBuster] Stale chunk detected in cached HTML. Clearing caches and reloading...');
                sessionStorage.setItem(reloadKey, String(now));
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                  });
                }
                window.location.reload();
              }
            }
          } catch (_) {}
        }, true);
      })();
    </script>
